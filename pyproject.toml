[project]
name = "trafficmonitor"
version = "0.1.0"
description = "Traffic Monitor System - Real-time video analytics for traffic monitoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0.0",
    "loguru>=0.7.0",
    "opencv-python>=4.5.0",
    "numpy>=1.21.0",
    "torch>=1.9.0",
    "torchvision>=0.10.0",
    "ultralytics>=8.0.0",
    "boxmot>=13.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.64.0",
    "onnx>=1.12.0, <1.18.0",
    "onnxruntime>=1.12.0",
    "pathlib2>=2.3.0",
    "shapely>=2.0.0",
    "tensorrt>=10.12.0.36",
]

[project.scripts]
traffic-monitor = "traffic_monitor.cli:main"
