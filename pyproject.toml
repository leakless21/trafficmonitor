[project]
name = "trafficmonitor"
version = "0.1.0"
description = "Traffic Monitor System - Real-time video analytics for traffic monitoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0.0",
    "loguru>=0.7.0",
    "numpy>=1.21.0",
    "torch>=1.9.0",
    "torchvision>=0.10.0",
    "ultralytics>=8.0.0",
    "boxmot>=13.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.64.0",
    "onnx>=1.12.0, <1.18.0",
    "onnxruntime>=1.12.0",
    "pathlib2>=2.3.0",
    "shapely>=2.0.0",
    "tensorrt>=10.12.0.36",
    "opencv-python>=4.11.0.86",
    "fast-plate-ocr[onnx-gpu,train]>=1.0.1",
    "jupyter>=1.1.1",
    "ipykernel>=6.29.5",
    "onnxruntime-gpu>=1.22.0",
]

[project.scripts]
traffic-monitor = "traffic_monitor.cli:main"

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "W", "C90", "I", "N", "UP", "YTT", "S", "BLE", "FBT", "B", "A", "COM", "C4", "DTZ", "T10", "EM", "EXE", "ISC", "ICN", "G", "INP", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SIM", "TID", "TCH", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "NPY", "RUF"]
ignore = ["E501", "S101", "PLR0913", "PLR0912", "PLR0915", "C901"]

[tool.ruff.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "ARG001"]
"tools/**/*.py" = ["T201", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["build/", "dist/", ".venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests", 
    "slow: Slow tests",
    "gpu: Tests requiring GPU"
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError", 
    "raise NotImplementedError",
    "if __name__ == .__main__.:"
]
