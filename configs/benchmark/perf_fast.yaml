# Performance Benchmark Configuration - Fast Mode
# Optimized for quick performance checks during development

# Processing settings
process_every_nth_frame: 3 # Skip frames for speed
resolution:
  width: 640
  height: 480

# Detection settings
detection:
  model: "yolov8n.pt" # Nano model for speed
  confidence: 0.4
  device: "auto"
  max_detections: 50

# Tracking settings
tracking:
  tracker: "bytetrack" # Fast tracker
  max_tracks: 30
  track_buffer: 15

# License plate settings
license_plate:
  enabled: true
  detection_frequency: 10 # Every 10 frames
  crop_expansion: 0.1
  min_confidence: 0.3

# OCR settings
ocr:
  enabled: true
  engine: "paddleocr" # Fast OCR engine
  batch_size: 1
  use_gpu: true
  lang: "en"

# Counting settings
counting:
  lines_enabled: true
  zone_counting: false # Disable complex zone counting

# Visualization (minimal for performance)
visualization:
  enabled: false # Disable visualization
  show_tracks: false
  show_detections: false

# Performance settings
performance:
  multiprocessing: true
  queue_size: 10 # Smaller queues
  gpu_memory_fraction: 0.3

# Logging
logging:
  level: "WARNING" # Minimal logging
  performance_metrics: true
  save_frames: false
