# Fast Benchmark Configuration
# Optimized for speed over accuracy for quick CI runs

frame_grabber:
  video_source: "data/videos/input/IMG_3637.MOV" # Will be overridden by benchmark runner
  resize_resolution: [640, 360] # Lower resolution for speed
  log_every_n_frames: 300 # Minimal logging
  process_every_n_frame: 3 # Skip frames for speed

vehicle_detector:
  model_path: "data/models/best(8).pt"
  conf_threshold: 0.5 # Lower confidence for speed
  class_mapping:
    0: "bicycle"
    1: "bike"
    2: "bus"
    3: "car"
    4: "person"
    5: "truck"

vehicle_tracker:
  tracker_type: "bytetrack" # Fast tracker
  half: true # Use half precision
  device: "cpu"
  reid_model_path: None
  evolve_param_dict: None
  per_class: None

lp_detector:
  model_path: "data/models/plate_v8n.pt"
  conf_threshold: 0.5 # Lower confidence for speed

ocr_reader:
  backend: "paddleocr"
  lang: "en"
  use_gpu: false
  hub_model_name: "global-plates-mobile-vit-v2-model"
  device: "cpu"
  conf_threshold: 0.6 # Lower confidence for speed

vehicle_counter:
  counting_lines:
    - # Primary counting line
      - [0.31, 0.22]
      - [0.85, 0.33]

visualizer:
  font: "FONT_HERSHEY_SIMPLEX"
  font_scale: 0.5
  font_thickness: 1
  ocr_duration: 2.0
  save_to_file: false # Real-time mode for speed
  save_path: "output/benchmark_videos/"
  output_fourcc: "mp4v"

  counting_lines:
    - # Copy from vehicle_counter
      - [0.31, 0.22]
      - [0.85, 0.33]
  counting_line_color: [0, 255, 255]
  counting_line_thickness: 2

  class_colors:
    car: [0, 119, 187]
    truck: [14, 127, 255]
    bus: [44, 160, 44]
    motorcycle: [40, 39, 214]
    bicycle: [189, 103, 148]
    person: [75, 86, 140]
  default_color: [255, 255, 255]

# Minimal logging for speed
loguru:
  level: "WARNING" # Only warnings and errors
  format: "<level>{level}</level> | <cyan>{name}</cyan> - <level>{message}</level>"
  use_json: false
  file_path: "logs/benchmark_fast.log"
  file_rotation: "5 MB"
  file_retention: "1 day"
  file_compression: "zip"
  log_file_overwrite: true
  terminal_output_enabled: false

# Fast database configuration
database:
  path: "data/db/benchmark_fast.db"
  reset_on_startup: true
  pragmas:
    journal_mode: "MEMORY" # Fastest mode
    synchronous: "OFF" # Disable sync for speed
    cache_size: -32000 # Smaller cache
    temp_store: "MEMORY"
